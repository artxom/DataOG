<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Data.O.G</title>
  <link id="dynamic-favicon" rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="os-root" class="os-shell" data-wallpaper="default">
    <!-- 顶部 28px macOS 全局毛玻璃菜单栏 -->
    <header id="os-menubar" class="os-menubar" role="banner">
      <div class="menubar-left">
        <button id="btn-menubar-home" type="button" class="menubar-brand-btn" title="显示桌面">
          <span id="menubar-brand-icon" class="menubar-brand-icon" aria-hidden="true"></span>
          <span class="menubar-brand-name">Data.O.G</span>
        </button>
        <span id="menubar-active-app" class="menubar-active-app">桌面</span>
      </div>

      <div class="menubar-right">
        <button id="btn-menubar-ai" type="button" class="menubar-pill-btn" title="配置 AI 模型">
          <span id="menubar-ai-dot" class="dot dot-muted"></span>
          <span id="menubar-ai-label">AI 未配密钥</span>
        </button>
        <button id="btn-menubar-search" type="button" class="menubar-icon-btn" title="全局检索元数据 (⌘K)" aria-label="全局检索元数据">
          <span id="menubar-icon-search"></span>
          <span class="menubar-kbd">⌘K</span>
        </button>
        <button id="btn-menubar-logs" type="button" class="menubar-icon-btn" title="运行日志与 SQL 审计" aria-label="运行日志">
          <span id="menubar-icon-logs"></span>
          <span id="menubar-log-badge" class="menubar-count-dot" hidden>0</span>
        </button>
        <button id="btn-toggle-theme" type="button" class="menubar-icon-btn" title="切换外观模式" aria-label="切换深浅色模式">
          <span id="menubar-theme-label">自动</span>
        </button>
        <time id="menubar-clock" class="menubar-clock">--:--</time>
      </div>
    </header>

    <!-- macOS 桌面层：品牌徽记 + 四大独立模块超椭圆图标 -->
    <main id="desktop-surface" class="desktop-surface" aria-label="Data.O.G 桌面">
      <div class="desktop-center-stage">
        <div class="desktop-brand-hero">
          <div id="desktop-brand-emblem" class="desktop-brand-emblem" aria-hidden="true"></div>
          <h1 class="desktop-brand-title">Data.O.G</h1>
        </div>

        <nav id="desktop-icon-grid" class="desktop-icon-grid" aria-label="桌面应用模块"></nav>
      </div>
    </main>

    <!-- 活动模块窗口挂载层 -->
    <section id="window-host" class="window-host" hidden aria-live="polite"></section>

    <!-- 屏幕右下角毛玻璃最小化小抽屉（保留挂起工作状态，点击即刻恢复） -->
    <aside id="minimized-drawer" class="corner-drawer" hidden aria-label="已最小化的工作窗口"></aside>
  </div>

  <!-- Spotlight 全局秒级元数据检索 (<dialog>) -->
  <dialog id="spotlight-modal" class="mac-dialog spotlight-dialog" closedby="any" aria-labelledby="spotlight-title">
    <div class="dialog-sheet">
      <header class="spotlight-bar">
        <h2 id="spotlight-title" class="sr-only">全局库表与字段检索</h2>
        <input
          id="spotlight-input"
          class="spotlight-input"
          type="search"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="none"
          spellcheck="false"
          placeholder="搜索已缓存的表名、视图名、字段名或中文注释..."
          aria-label="搜索表名、视图名、字段名或注释"
        />
        <button id="spotlight-close" type="button" class="mac-btn mac-btn-ghost">关闭</button>
      </header>
      <div id="spotlight-results" class="spotlight-results"></div>
    </div>
  </dialog>

  <!-- 全局任务与 SQL 审计控制台弹窗 (<dialog>) -->
  <dialog id="logs-modal" class="mac-dialog logs-dialog" closedby="any" aria-labelledby="logs-modal-title">
    <div class="dialog-sheet">
      <header class="dialog-header">
        <h2 id="logs-modal-title" class="dialog-title">执行日志</h2>
        <div class="dialog-header-actions">
          <select id="log-level-filter" class="mac-input mac-input-sm" aria-label="日志级别过滤">
            <option value="ALL">全部</option>
            <option value="INFO">INFO</option>
            <option value="WARN">WARN</option>
            <option value="ERROR">ERROR</option>
          </select>
          <button id="btn-refresh-logs" type="button" class="mac-btn mac-btn-sm">刷新</button>
          <button id="btn-clear-logs" type="button" class="mac-btn mac-btn-sm">清空</button>
          <button id="logs-modal-close" type="button" class="mac-btn mac-btn-sm mac-btn-ghost">关闭</button>
        </div>
      </header>
      <div id="drawer-log-list" class="logs-body" tabindex="0" role="log"></div>
    </div>
  </dialog>

  <!-- 通用模态确认与表单弹窗 (<dialog>) -->
  <dialog id="global-modal" class="mac-dialog" closedby="any" aria-labelledby="global-modal-title">
    <div class="dialog-sheet">
      <header class="dialog-header">
        <h2 id="global-modal-title" class="dialog-title">提示</h2>
        <button id="global-modal-close" type="button" class="mac-btn mac-btn-sm mac-btn-ghost" aria-label="关闭弹窗">关闭</button>
      </header>
      <div id="global-modal-body" class="dialog-body"></div>
      <footer id="global-modal-footer" class="dialog-footer"></footer>
    </div>
  </dialog>

  <!-- 顶部胶囊轻提示栈 (Toast) -->
  <div id="toast-root" class="toast-stack" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
